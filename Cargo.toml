[package]
name          = "reactant"
version       = "0.3.0"
edition       = "2024"
description   = "Static analyzer for React hook bugs (infinite loops, missing deps, derived state, ...) based on abstract interpretation over a dedicated CFG-based IR."
license       = "MIT"
repository    = "https://github.com/rboudrouss/reactant-analyzer"
readme        = "README.md"
authors       = ["rboudrouss <r.boudrouss@gmail.com>"]
keywords      = ["react", "static-analysis", "linter", "hooks", "abstract-interpretation"]
categories    = ["development-tools", "development-tools::debugging"]

[workspace]
members = [".", "crates/reactant-wasm"]

[features]
default = ["cli", "schema-gen"]
# The CLI (clap and friends) is binary-only; the wasm build uses
# `default-features = false` to keep the dependency tree to oxc + serde.
cli = ["dep:clap"]
# JSON Schema generation (ADR-022 §6): only the `reactant schemas` emitter
# needs schemars — validation is serde + hand checks, so the wasm build
# drops it.
schema-gen = ["dep:schemars"]

[[bin]]
name = "reactant"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "reactant"
path = "src/lib.rs"

[dependencies]
oxc_parser    = "0.138.0"
oxc_ast       = "0.138.0"
oxc_span      = "0.138.0"
oxc_allocator = "0.138.0"
clap          = { version = "4", features = ["derive"], optional = true }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
serde_path_to_error = "0.1"
schemars      = { version = "1", optional = true }
