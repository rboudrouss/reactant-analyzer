[package]
name          = "reactant"
version       = "0.1.0"
edition       = "2024"
description   = "Static analyzer for React hook bugs (infinite loops, missing deps, derived state, ...) based on abstract interpretation over a dedicated CFG-based IR."
license       = "MIT"
repository    = "https://github.com/rboudrouss/reactant-analyzer"
readme        = "README.md"
authors       = ["rboudrouss <r.boudrouss@gmail.com>"]
keywords      = ["react", "static-analysis", "linter", "hooks", "abstract-interpretation"]
categories    = ["development-tools", "development-tools::debugging"]

[[bin]]
name = "reactant"
path = "src/main.rs"

[lib]
name = "reactant"
path = "src/lib.rs"

[dependencies]
oxc_parser    = "0.129.0"
oxc_ast       = "0.129.0"
oxc_span      = "0.129.0"
oxc_allocator = "0.129.0"
clap          = { version = "4", features = ["derive"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
