[package]
name = "reactant"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "reactant"
path = "src/main.rs"

[lib]
name = "reactant"
path = "src/lib.rs"

[dependencies]
oxc_parser    = "0.129.0"
oxc_ast       = "0.129.0"
oxc_span      = "0.129.0"
oxc_allocator = "0.129.0"

clap     = { version = "4", features = ["derive"] }
walkdir  = "2"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
