[package]
name    = "reactant-wasm"
version = "0.3.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reactant = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
console_error_panic_hook = "0.1"
